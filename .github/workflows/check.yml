name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      # The manifests, and every hook and call the module makes.
      - name: Validate
        run: claude plugin validate . --strict

      # The plugin's own tests. These answer the engine's fetch from fixed
      # bodies, so no platform and no credentials are needed.
      - name: Test
        run: claude plugin test ./uniform

  dsh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uniform-dsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      # Type-check, rebuild dist/ and fail if it differs from the committed
      # build, then run the hooks through the bridge's own test kit.
      - run: npm run check

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uniform-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      # Type-check, rebuild dist/ and fail if it differs from the committed
      # build, then test every tool through the MCP SDK's client and the built
      # server over stdio.
      - run: npm run check
